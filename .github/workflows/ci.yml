name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Tk para smoke GUI
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Pytest
        working-directory: .
        env:
          PYTHONPATH: backend:.
        run: xvfb-run pytest -v backend/tests control_panel/tests

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  standalone-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Export estatico
        working-directory: frontend
        env:
          BUILD_MODE: standalone
        run: |
          npm ci
          npm run build
          test -f out/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke arranque congelado (imports)
        run: |
          pip install -r backend/requirements.txt
          python packaging/test_frozen_boot.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Compose
        run: docker compose build
